name: Ansible Check

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-check.yml"
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Ansible syntax and lint
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "ansible/playbooks/*.yml" > /dev/null; then
            ansible-lint ansible/playbooks
            for playbook in ansible/playbooks/*.yml; do
              ansible-playbook --syntax-check "${playbook}"
            done
          else
            echo "No Ansible playbooks yet."
          fi
