name: Deploy Promtail Production

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host to deploy'
        required: true
        default: 'production-infra'
        type: choice
        options:
          - production-frontend
          - production-backend
          - production-infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event.inputs.host }}" == "production-frontend" ]]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST_PROD_FRONT }}" >> $GITHUB_ENV
            echo "VPS_PORT=${{ secrets.VPS_SSH_PORT_PROD }}" >> $GITHUB_ENV
            echo "VPS_USERNAME=${{ secrets.VPS_USERNAME_PROD_FRONT }}" >> $GITHUB_ENV
            echo "VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY_PROD_FRONT }}" >> $GITHUB_ENV
            echo "PROMTAIL_CONFIG=promtail-config.production-frontend.yml" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.host }}" == "production-backend" ]]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST_PROD_BACK }}" >> $GITHUB_ENV
            echo "VPS_PORT=${{ secrets.VPS_SSH_PORT_PROD }}" >> $GITHUB_ENV
            echo "VPS_USERNAME=${{ secrets.VPS_USERNAME_PROD_BACK }}" >> $GITHUB_ENV
            echo "VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY_PROD_BACK }}" >> $GITHUB_ENV
            echo "PROMTAIL_CONFIG=promtail-config.production-backend.yml" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.host }}" == "production-infra" ]]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST_PROD_INFRA }}" >> $GITHUB_ENV
            echo "VPS_PORT=${{ secrets.VPS_SSH_PORT_PROD }}" >> $GITHUB_ENV
            echo "VPS_USERNAME=${{ secrets.VPS_USERNAME_PROD_INFRA }}" >> $GITHUB_ENV
            echo "VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY_INFRA }}" >> $GITHUB_ENV
            echo "PROMTAIL_CONFIG=promtail-config.production-infra.yml" >> $GITHUB_ENV
          fi

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy promtail configuration
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "./${{ env.PROMTAIL_CONFIG }}"
          target: "/home/${{ env.VPS_USERNAME }}/promtail/"

      - name: Deploy and verify promtail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            docker stop promtail || true
            docker rm promtail || tr
