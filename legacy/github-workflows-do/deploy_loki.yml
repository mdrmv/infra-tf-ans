name: Deploy Loki

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host to deploy'
        required: true
        default: 'dev_infra-droplet'
        type: choice
        options:
          - dev_infra-droplet
          - production-infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event.inputs.host }}" == "dev_infra-droplet" ]]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST }}" >> $GITHUB_ENV
            echo "VPS_PORT=${{ secrets.VPS_SSH_PORT }}" >> $GITHUB_ENV
            echo "VPS_USERNAME=${{ secrets.VPS_USERNAME }}" >> $GITHUB_ENV
            echo "VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY }}" >> $GITHUB_ENV
            echo "LOKI_CONFIG=loki-config.yml" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.host }}" == "production-infra" ]]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST_PROD_INFRA }}" >> $GITHUB_ENV
            echo "VPS_PORT=${{ secrets.VPS_SSH_PORT_PROD }}" >> $GITHUB_ENV
            echo "VPS_USERNAME=${{ secrets.VPS_USERNAME_PROD_INFRA }}" >> $GITHUB_ENV
            echo "VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY_PROD_INFRA }}" >> $GITHUB_ENV
            echo "LOKI_CONFIG=loki-config.production-infra.yml" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy loki configuration
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "./${{ env.LOKI_CONFIG }}"
          target: "/home/${{ env.VPS_USERNAME }}/loki/"

      - name: Remove old container and deploy loki container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            docker stop loki || true
            docker rm loki || true            
            docker pull grafana/loki:latest
            docker run -d --restart=unless-stopped --name loki --net ngdem -p 3100:3100 \
                -v /home/${{ env.VPS_USERNAME }}/loki/${{ env.LOKI_CONFIG }}:/etc/loki/loki-config.yml \
                -v /var/lib/loki/chunks:/loki/chunks \
                -v /var/lib/loki/rules:/loki/rules \
                grafana/loki:2.9.9 -config.file=/etc/loki/loki-config.yml

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run Healthcheck
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            retries=5
            delay_seconds=10

            for attempt in $(seq "$retries"); do
              http_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/ready)
              
              if [ "$http_status" -eq 200 ]; then
                echo "The service has been successfully raised"
                exit 0
              else
                echo "Healthcheck failed (attempt $attempt/$retries), HTTP status: $http_status"
              fi

              if [ "$attempt" -lt "$retries" ]; then
                sleep "$delay_seconds"
              fi
            done

            echo "Loki service failed healthcheck after $retries attempts."
            exit 1
